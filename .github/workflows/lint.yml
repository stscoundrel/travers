name: Go - Lint

on: [pull_request]

defaults:
  run:
    working-directory: src

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22.x', '1.23.x']
    steps:
      - uses: actions/checkout@v6
      - name: Lint in Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go vet
